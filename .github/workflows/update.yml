name: Update grant data

on:
  schedule:
    - cron: "17 5 * * *" # every day at 05:17 UTC
  workflow_dispatch: # adds the manual "Run workflow" button

permissions:
  contents: write # to save the new data in the repository
  pages: write # to publish the page
  id-token: write # required by the Pages publishing step

concurrency:
  group: update-grant-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the one Python package needed
        run: pip install -r requirements.txt

      # If this step fails, nothing below runs, so the old data stays in place.
      - name: Fetch grant calls
        run: python fetch_grants.py

      - name: Save the data in the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git commit -m "Update grant data $(date -u +%F)"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Publish the page
        id: publish
        uses: actions/deploy-pages@v4
